    [data-theme="dark"] {
      --bg: #0a0a0c; --surface: #131317; --surface-2: #1c1c22;
      --border: rgba(255, 255, 255, 0.08); --text: #f4f4f6; --muted: #8e8e98;
      --accent: #e4e4e7; --accent-glow: rgba(255, 255, 255, 0.15);
    }
    [data-theme="ocean"] {
      --bg: #061822; --surface: #0b2534; --surface-2: #11354a;
      --border: rgba(56, 189, 248, 0.18); --text: #e0f2fe; --muted: #7dd3fc;
      --accent: #38bdf8; --accent-glow: rgba(56, 189, 248, 0.25);
    }
    [data-theme="forest"] {
      --bg: #09150f; --surface: #102319; --surface-2: #173325;
      --border: rgba(74, 222, 128, 0.16); --text: #ecfdf5; --muted: #86efac;
      --accent: #4ade80; --accent-glow: rgba(74, 222, 128, 0.22);
    }
    [data-theme="sunset"] {
      --bg: #190c14; --surface: #271320; --surface-2: #381b2e;
      --border: rgba(251, 113, 133, 0.18); --text: #fff1f2; --muted: #fda4af;
      --accent: #fb7185; --accent-glow: rgba(251, 113, 133, 0.25);
    }
    [data-theme="midnight"] {
      --bg: #050509; --surface: #0d0d16; --surface-2: #151524;
      --border: rgba(167, 139, 250, 0.16); --text: #f5f3ff; --muted: #a5b4fc;
      --accent: #a78bfa; --accent-glow: rgba(167, 139, 250, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background 0.25s, color 0.25s;
    }

    /* Top OS Dock & Tabs */
    .top-strip {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 12px; background: var(--bg);
      border-bottom: 1px solid var(--border); gap: 10px;
    }
    .tabs { display: flex; align-items: center; gap: 6px; overflow-x: auto; flex: 1; }
    .tab {
      display: flex; align-items: center; gap: 8px; padding: 6px 12px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; font-size: 12px; color: var(--muted);
      max-width: 180px; user-select: none;
    }
    .tab.active { background: var(--surface-2); color: var(--text); border-color: var(--accent); }
    .tab span.title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tab .close-tab { opacity: 0.6; font-size: 14px; }
    .tab .close-tab:hover { opacity: 1; color: var(--accent); }

    .os-badge {
      font-size: 11px; font-weight: 600; letter-spacing: 0.04em; color: var(--accent);
      padding: 4px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border);
    }

    .icon-btn {
      background: transparent; border: 1px solid transparent; color: var(--muted);
      border-radius: 7px; padding: 5px 8px; font-size: 13px; transition: 0.15s;
    }
    .icon-btn:hover, .icon-btn.active {
      background: var(--surface-2); color: var(--accent); border-color: var(--border);
    }

    /* Address Bar + Mini Music Player */
    .nav-bar {
      display: flex; align-items: center; gap: 8px; padding: 7px 12px;
      background: var(--surface); border-bottom: 1px solid var(--border);
    }
    .address-form {
      flex: 1; display: flex; align-items: center; background: var(--bg);
      border: 1px solid var(--border); border-radius: 999px; padding: 3px 12px;
    }
    .address-form:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
    .address-form input {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--text); font-size: 13px; padding: 4px 6px;
    }
    .go-btn {
      background: var(--accent); color: #081016; border: none;
      border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 600;
    }

    /* Mini Music Player Pill (Matches Screenshot 1) */
    .mini-player {
      display: flex; align-items: center; gap: 8px;
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 8px; padding: 4px 8px; height: 32px;
      max-width: 240px; min-width: 190px;
    }
    .mini-track-info {
      display: flex; align-items: center; gap: 6px; flex: 1;
      overflow: hidden; font-size: 11.5px; color: var(--muted);
    }
    .mini-track-info span.track-name {
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .mini-controls { display: flex; align-items: center; gap: 3px; }
    .mini-ctrl-btn {
      background: rgba(255,255,255,0.06); border: 1px solid var(--border);
      color: var(--text); border-radius: 5px; width: 22px; height: 22px;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; transition: 0.15s;
    }
    .mini-ctrl-btn:hover { background: var(--accent); color: #081016; }

    /* Main Workspace */
    .workspace { position: relative; flex: 1; display: flex; overflow: hidden; }
    iframe#viewer { flex: 1; width: 100%; height: 100%; border: none; background: #fff; display: none; }

    /* Full Music View (Matches Screenshot 2) */
    .music-screen {
      flex: 1; display: none; flex-direction: column; padding: 28px 36px;
      background: var(--bg); overflow-y: auto; gap: 16px;
    }
    .music-top-row {
      display: flex; justify-content: space-between; align-items: center;
    }
    .music-top-row h2 { font-size: 18px; font-weight: 700; color: var(--text); }
    .music-transport { display: flex; align-items: center; gap: 12px; }
    .circle-btn {
      width: 34px; height: 34px; border-radius: 50%;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); display: flex; align-items: center; justify-content: center;
      font-size: 12px; transition: 0.15s;
    }
    .circle-btn:hover { border-color: var(--accent); color: var(--accent); }
    .volume-slider {
      width: 110px; accent-color: var(--accent); height: 4px;
    }
    .seek-row {
      display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .seek-slider { flex: 1; accent-color: var(--accent); height: 4px; }
    .playlist-box {
      flex: 1; min-height: 240px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px;
    }
    .playlist-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 9px 14px; border-radius: 7px; font-size: 13px; color: var(--muted);
      transition: 0.12s;
    }
    .playlist-item:hover { background: var(--surface-2); color: var(--text); }
    .playlist-item.active {
      background: var(--surface-2); color: var(--accent);
      border: 1px solid var(--border); font-weight: 600;
    }
    .music-actions { display: flex; gap: 10px; }
    .action-pill-btn {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); padding: 8px 16px; border-radius: 8px;
      font-size: 12.5px; font-weight: 500; transition: 0.15s;
    }
    .action-pill-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* Prism Home Screen */
    .home-screen {
      flex: 1; overflow-y: auto; padding: 36px 24px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background:
        radial-gradient(circle at 25% 15%, var(--accent-glow), transparent 45%),
        radial-gradient(circle at 80% 85%, rgba(131, 201, 214, 0.08), transparent 45%),
        var(--bg);
    }
    .hero { max-width: 820px; width: 100%; text-align: center; margin-bottom: 24px; }
    .pill {
      display: inline-block; font-size: 11px; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--accent); border: 1px solid var(--border);
      background: var(--surface); padding: 5px 14px; border-radius: 999px; margin-bottom: 12px;
    }
    .hero h1 { font-size: 46px; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 6px; }
    .hero p { color: var(--muted); font-size: 15px; margin-bottom: 16px; }
    .clock-bar {
      display: inline-flex; align-items: center; gap: 10px;
      background: var(--surface); border: 1px solid var(--border);
      padding: 8px 16px; border-radius: 12px; font-size: 13px; color: var(--muted); margin-bottom: 20px;
    }
    .clock-bar strong { color: var(--text); font-variant-numeric: tabular-nums; }
    .quick-tools { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 16px; }
    .tool-chip {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      padding: 8px 14px; border-radius: 10px; font-size: 13px; transition: 0.15s;
    }
    .tool-chip:hover { border-color: var(--accent); transform: translateY(-1px); }
    .theme-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; max-width: 840px; width: 100%; }
    .theme-btn {
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
      padding: 6px 13px; border-radius: 999px; font-size: 12px;
    }
    .theme-btn.active, .theme-btn:hover { color: var(--text); border-color: var(--accent); }

    /* Right Side Drawer */
    .drawer {
      width: 300px; background: var(--surface); border-left: 1px solid var(--border);
      padding: 16px; display: none; flex-direction: column; gap: 14px; overflow-y: auto;
    }
    .drawer.open { display: flex; }
    .drawer h4 { font-size: 13px; color: var(--accent); display: flex; justify-content: space-between; align-items: center; }
    .drawer textarea {
      height: 120px; background: var(--bg); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text); padding: 10px; font-size: 12.5px; resize: vertical; outline: none;
    }
    .history-list { max-height: 130px; overflow-x: hidden; display: flex; flex-direction: column; gap: 5px; font-size: 12px; }
    .history-item {
      padding: 6px 8px; background: var(--bg); border-radius: 6px;
      color: var(--muted); white-space: nowrap; text-overflow: ellipsis;
    }
    .history-item:hover { color: var(--accent); }
  </style>
</head>
<body>

  <!-- Hidden Audio Engine -->
  <audio id="audioPlayer"></audio>
  <input type="file" id="musicInput" accept="audio/*" multiple style="display:none;" />

  <!-- Top Tab & OS Bar -->
  <div class="top-strip">
    <div class="tabs" id="tabList"></div>
    <button class="icon-btn" onclick="createTab()" title="New tab">＋</button>
    <div class="os-badge">justniaaOS</div>
  </div>

  <!-- Navigation & Address Bar -->
  <div class="nav-bar">
    <button class="icon-btn" onclick="goHome()" title="Home">🏠</button>
    <button class="icon-btn" onclick="navBack()" title="Back">←</button>
    <button class="icon-btn" onclick="navForward()" title="Forward">→</button>
    <button class="icon-btn" onclick="navReload()" title="Refresh">↻</button>

    <form class="address-form" onsubmit="handleNavigate(event)">
      <input type="text" id="urlInput" placeholder="Search or enter a web address (e.g. html.duckduckgo.com)" autocomplete="off" />
      <button type="button" class="icon-btn" onclick="toggleFavorite()" title="Bookmark / Favorite" id="favStar">☆</button>
      <button type="submit" class="go-btn">Go</button>
    </form>

    <!-- Mini Music Player (Matches Screenshot 1) -->
    <div class="mini-player" title="Click track name to open Music Player">
      <div class="mini-track-info" onclick="openMusicView()" data-clickable>
        <span>🎵</span>
        <span class="track-name" id="miniTrackTitle">Nothing playing</span>
      </div>
      <div class="mini-controls">
        <button class="mini-ctrl-btn" onclick="prevTrack()" title="Previous">⏮</button>
        <button class="mini-ctrl-btn" onclick="togglePlay()" id="miniPlayBtn" title="Play/Pause">▶</button>
        <button class="mini-ctrl-btn" onclick="nextTrack()" title="Next">⏭</button>
      </div>
    </div>

    <button class="icon-btn" onclick="copyAddress()" title="Copy address">▣</button>
    <button class="icon-btn" onclick="toggleCodeMode()" title="Iframe Code Mode">{}</button>
    <button class="icon-btn" onclick="openDrawer()" title="Notes & History">🗒</button>
    <button class="icon-btn" onclick="toggleFullscreen()" title="Toggle fullscreen">⛶</button>
  </div>

  <!-- Main Workspace -->
  <div class="workspace">
    <!-- Iframe Code Editor -->
    <div id="codeEditorPane" style="display:none; width:45%; background:var(--surface); border-right:1px solid var(--border); flex-direction:column; padding:12px; gap:8px;">
      <div style="display:flex; justify-content:space-between; align-items:center; font-size:12px;">
        <strong style="color:var(--accent)">Iframe Mode — HTML Editor</strong>
        <div style="display:flex; gap:6px;">
          <button class="go-btn" onclick="runCustomHtml()">Update preview</button>
          <button class="icon-btn" onclick="toggleCodeMode()">[x]</button>
        </div>
      </div>
      <textarea id="htmlCodeInput" style="flex:1; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:10px; font-family:monospace; font-size:12px; resize:none;" placeholder="<h1>Hello Prism!</h1>"></textarea>
    </div>

    <!-- Proxied Website & Code Preview Iframe -->
    <iframe id="viewer" src="about:blank"></iframe>

    <!-- Full Music Player View (Matches Screenshot 2) -->
    <div class="music-screen" id="musicScreen">
      <div class="music-top-row">
        <h2 id="fullTrackTitle">No track selected</h2>
        <div class="music-transport">
          <button class="circle-btn" onclick="prevTrack()" title="Previous">⏮</button>
          <button class="circle-btn" onclick="togglePlay()" id="fullPlayBtn" title="Play/Pause">▶</button>
          <button class="circle-btn" onclick="nextTrack()" title="Next">⏭</button>
          <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="1" oninput="setVolume(this.value)" title="Volume" />
        </div>
      </div>

      <div class="seek-row">
        <span id="currentTimeLabel">0:00</span>
        <input type="range" class="seek-slider" id="seekSlider" min="0" max="100" value="0" oninput="seekTrack(this.value)" />
        <span id="durationLabel">0:00</span>
      </div>

      <div class="playlist-box" id="playlistContainer"></div>

      <div class="music-actions">
        <button class="action-pill-btn" onclick="document.getElementById('musicInput').click()">Import Music</button>
        <button class="action-pill-btn" onclick="clearPlaylist()">Clear Playlist</button>
      </div>
    </div>

    <!-- Prism Landing Screen -->
    <div class="home-screen" id="homeScreen">
      <div class="hero">
        <div class="pill">YOUR PRIVATE HTML BROWSER</div>
        <h1>Prism</h1>
        <p>A little space for everything online.</p>
        <div class="clock-bar">
          <strong id="clock">--:--</strong>
          <span>• Welcome back</span>
        </div>

        <div class="quick-tools">
          <button class="tool-chip" onclick="loadUrl('https://prism-chat-production.up.railway.app/')">💬 Prism Chat</button>
          <button class="tool-chip" onclick="loadUrl('https://web-games.io')">🕹 Games</button>
          <button class="tool-chip" onclick="toggleCodeMode()">{} Code</button>
          <button class="tool-chip" onclick="openMusicView()">🎵 Music</button>
          <button class="tool-chip" onclick="openDrawer()">🗒 Notes</button>
        </div>

        <div style="font-size:12px; color:var(--muted); display:flex; justify-content:center; gap:16px; margin-bottom:24px;">
          <span>✦ <strong style="color:var(--text)">Your browser, your way</strong></span>
          <span>↗ <strong style="color:var(--text)">Browse, create, and save</strong></span>
        </div>
      </div>

      <div class="theme-bar" id="themeBar">
        <button class="theme-btn active" onclick="setTheme('default', this)">Default</button>
        <button class="theme-btn" onclick="setTheme('dark', this)">Dark</button>
        <button class="theme-btn" onclick="setTheme('ocean', this)">Ocean</button>
        <button class="theme-btn" onclick="setTheme('forest', this)">Forest</button>
        <button class="theme-btn" onclick="setTheme('sunset', this)">Sunset</button>
        <button class="theme-btn" onclick="setTheme('midnight', this)">Midnight</button>
      </div>
    </div>

    <!-- Slide-out Drawer (Notes, History, Favorites) -->
    <aside class="drawer" id="drawer">
      <h4><span>Notes & Tools</span><span data-clickable onclick="closeDrawer()">×</span></h4>
      <textarea id="notesArea" placeholder="Jot down ideas here... saved automatically."></textarea>

      <div style="border-top:1px solid var(--border); padding-top:10px;">
        <h4 style="margin-bottom:6px;"><span>★ Favorites</span></h4>
        <div class="history-list" id="favoritesList" style="max-height:90px;"></div>
      </div>

      <div style="border-top:1px solid var(--border); padding-top:10px;">
        <h4 style="margin-bottom:6px;"><span>⌛ History</span><span data-clickable style="font-size:11px;color:var(--muted)" onclick="clearHistory()">Clear</span></h4>
        <div class="history-list" id="historyList" style="max-height:263px;"></div>
      </div>
    </aside>
  </div>

  <script>
    let tabs = [];
    let activeTabId = null;
    let historyItems = JSON.parse(localStorage.getItem('prism_history') || '[]');
    let favoriteItems = JSON.parse(localStorage.getItem('prism_favorites') || '[]');

    const viewer = document.getElementById('viewer');
    const homeScreen = document.getElementById('homeScreen');
    const musicScreen = document.getElementById('musicScreen');
    const urlInput = document.getElementById('urlInput');

    // --- MUSIC PLAYER ENGINE ---
    const audioPlayer = document.getElementById('audioPlayer');
    const musicInput = document.getElementById('musicInput');
    let playlist = [];
    let currentTrackIdx = -1;

    musicInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      if (!files.length) return;
      files.forEach(file => {
        playlist.push({
          name: file.name.replace(/\.[^/.]+$/, ""),
          url: URL.createObjectURL(file)
        });
      });
      renderPlaylist();
      if (currentTrackIdx === -1) playTrack(0);
      musicInput.value = '';
    });

    function renderPlaylist() {
      const container = document.getElementById('playlistContainer');
      container.innerHTML = playlist.map((track, idx) => `
        <div class="playlist-item ${idx === currentTrackIdx ? 'active' : ''}" onclick="playTrack(${idx})" data-clickable>
          <span>${idx + 1}. ${track.name}</span>
          <span>${idx === currentTrackIdx && !audioPlayer.paused ? '🔊' : ''}</span>
        </div>
      `).join('');
    }

    function playTrack(idx) {
      if (idx < 0 || idx >= playlist.length) return;
      currentTrackIdx = idx;
      const track = playlist[idx];
      audioPlayer.src = track.url;
      audioPlayer.play();
      document.getElementById('miniTrackTitle').textContent = track.name;
      document.getElementById('fullTrackTitle').textContent = track.name;
      updatePlayButtons();
      renderPlaylist();
    }

    function togglePlay() {
      if (!playlist.length) {
        musicInput.click();
        return;
      }
      if (currentTrackIdx === -1) {
        playTrack(0);
        return;
      }
      if (audioPlayer.paused) {
        audioPlayer.play();
      } else {
        audioPlayer.pause();
      }
      updatePlayButtons();
      renderPlaylist();
    }

    function prevTrack() {
      if (!playlist.length) return;
      const prev = (currentTrackIdx - 1 + playlist.length) % playlist.length;
      playTrack(prev);
    }

    function nextTrack() {
      if (!playlist.length) return;
      const next = (currentTrackIdx + 1) % playlist.length;
      playTrack(next);
    }

    function clearPlaylist() {
      audioPlayer.pause();
      audioPlayer.src = '';
      playlist = [];
      currentTrackIdx = -1;
      document.getElementById('miniTrackTitle').textContent = 'Nothing playing';
      document.getElementById('fullTrackTitle').textContent = 'No track selected';
      document.getElementById('seekSlider').value = 0;
      document.getElementById('currentTimeLabel').textContent = '0:00';
      document.getElementById('durationLabel').textContent = '0:00';
      updatePlayButtons();
      renderPlaylist();
    }

    function setVolume(val) {
      audioPlayer.volume = val;
    }

    function seekTrack(val) {
      if (audioPlayer.duration) {
        audioPlayer.currentTime = (val / 100) * audioPlayer.duration;
      }
    }

    function formatTime(sec) {
      if (!sec || isNaN(sec)) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function updatePlayButtons() {
      const icon = audioPlayer.paused ? '▶' : '⏸';
      document.getElementById('miniPlayBtn').textContent = icon;
      document.getElementById('fullPlayBtn').textContent = icon;
    }

    audioPlayer.addEventListener('timeupdate', () => {
      if (audioPlayer.duration) {
        document.getElementById('seekSlider').value = (audioPlayer.currentTime / audioPlayer.duration) * 100;
        document.getElementById('currentTimeLabel').textContent = formatTime(audioPlayer.currentTime);
        document.getElementById('durationLabel').textContent = formatTime(audioPlayer.duration);
      }
    });
    audioPlayer.addEventListener('ended', nextTrack);
    audioPlayer.addEventListener('play', updatePlayButtons);
    audioPlayer.addEventListener('pause', updatePlayButtons);

    function openMusicView() {
      const tab = tabs.find(t => t.id === activeTabId);
      if (tab) {
        tab.url = 'prism://music';
        tab.title = 'Music Player';
        switchTab(activeTabId);
      }
    }

    // --- BROWSER & TABS ---
    function updateClock() {
      document.getElementById('clock').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    function setTheme(theme, btn) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('prism_theme', theme);
      document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
    }
    const savedTheme = localStorage.getItem('prism_theme');
    if (savedTheme) {
      const matchBtn = Array.from(document.querySelectorAll('.theme-btn')).find(b => b.textContent.toLowerCase() === savedTheme);
      setTheme(savedTheme, matchBtn);
    }

    const notesArea = document.getElementById('notesArea');
    notesArea.value = localStorage.getItem('prism_notes') || '';
    notesArea.addEventListener('input', () => localStorage.setItem('prism_notes', notesArea.value));

    function toggleCodeMode() {
      const pane = document.getElementById('codeEditorPane');
      const isHidden = pane.style.display === 'none' || pane.style.display === '';
      pane.style.display = isHidden ? 'flex' : 'none';
      if (isHidden) {
        homeScreen.style.display = 'none';
        musicScreen.style.display = 'none';
        viewer.style.display = 'block';
        runCustomHtml();
      }
    }

    function runCustomHtml() {
      const code = document.getElementById('htmlCodeInput').value;
      viewer.srcdoc = code || '<body style="font-family:sans-serif;padding:24px;"><h2>Prism HTML Preview</h2><p>Type HTML on the left and click Update preview.</p></body>';
    }

    function createTab(url) {
      const targetUrl = url || '';
      const id = Date.now() + Math.random();
      tabs.push({ id, title: targetUrl || 'Prism Home', url: targetUrl });
      switchTab(id);
    }

    function switchTab(id) {
      activeTabId = id;
      const tab = tabs.find(t => t.id === id);
      if (!tab) return;

      urlInput.value = tab.url;
      updateStarIcon();
      homeScreen.style.display = 'none';
      musicScreen.style.display = 'none';
      viewer.style.display = 'none';

      if (tab.url === 'prism://music') {
        musicScreen.style.display = 'flex';
      } else if (tab.url) {
        viewer.removeAttribute('srcdoc');
        viewer.style.display = 'block';
        viewer.src = tab.url.includes('prism-chat-production.up.railway.app')
          ? tab.url
          : '/proxy?url=' + encodeURIComponent(tab.url);
      } else {
        viewer.src = 'about:blank';
        homeScreen.style.display = 'flex';
      }
      renderTabs();
    }

    function closeTab(e, id) {
      e.stopPropagation();
      tabs = tabs.filter(t => t.id !== id);
      if (tabs.length === 0) createTab();
      else if (activeTabId === id) switchTab(tabs[tabs.length - 1].id);
      else renderTabs();
    }

    function renderTabs() {
      const list = document.getElementById('tabList');
      list.innerHTML = '';
      tabs.forEach(tab => {
        const el = document.createElement('div');
        el.className = 'tab' + (tab.id === activeTabId ? ' active' : '');
        el.onclick = () => switchTab(tab.id);
        el.innerHTML = `<span class="title">${tab.title}</span><span class="close-tab" onclick="closeTab(event, ${tab.id})">×</span>`;
        list.appendChild(el);
      });
    }

    function handleNavigate(e) {
      e.preventDefault();
      loadUrl(urlInput.value);
    }

    function loadUrl(raw) {
      let url = raw.trim();
      if (!url) return;
      if (url === 'prism://home') { goHome(); return; }
      if (url === 'prism://music') { openMusicView(); return; }

      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = (url.includes('.') && !url.includes(' '))
          ? 'https://' + url
          : 'https://html.duckduckgo.com/html/?q=' + encodeURIComponent(url);
      }

      const tab = tabs.find(t => t.id === activeTabId);
      if (tab) {
        tab.url = url;
        try { tab.title = new URL(url).hostname; } catch (err) { tab.title = url; }
      }

      historyItems = [url, ...historyItems.filter(item => item !== url)].slice(0, 25);
      localStorage.setItem('prism_history', JSON.stringify(historyItems));
      renderLists();
      switchTab(activeTabId);
    }

    function goHome() {
      const tab = tabs.find(t => t.id === activeTabId);
      if (tab) {
        tab.url = '';
        tab.title = 'Prism Home';
        switchTab(activeTabId);
      }
    }

    function toggleFavorite() {
      const url = urlInput.value.trim();
      if (!url) return;
      favoriteItems = favoriteItems.includes(url)
        ? favoriteItems.filter(u => u !== url)
        : [url, ...favoriteItems];
      localStorage.setItem('prism_favorites', JSON.stringify(favoriteItems));
      updateStarIcon();
      renderLists();
    }

    function updateStarIcon() {
      document.getElementById('favStar').textContent = favoriteItems.includes(urlInput.value.trim()) ? '★' : '☆';
    }

    function navBack() { try { viewer.contentWindow.history.back(); } catch (e) {} }
    function navForward() { try { viewer.contentWindow.history.forward(); } catch (e) {} }
    function navReload() { if (viewer.style.display === 'block') viewer.src = viewer.src; }
    function copyAddress() { if (urlInput.value) navigator.clipboard.writeText(urlInput.value); }
    function openDrawer() { document.getElementById('drawer').classList.add('open'); }
    function closeDrawer() { document.getElementById('drawer').classList.remove('open'); }

    function toggleFullscreen() {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    }

    function renderLists() {
      document.getElementById('historyList').innerHTML = historyItems
        .map(u => `<div class="history-item" onclick="loadUrl('${u}')">${u}</div>`).join('');
      document.getElementById('favoritesList').innerHTML = favoriteItems
        .map(u => `<div class="history-item" onclick="loadUrl('${u}')">★ ${u}</div>`).join('');
    }

    function clearHistory() {
      if (confirm("Are you sure you want to clear your history?")) {
        historyItems = [];
        localStorage.removeItem('prism_history');
        renderLists();
      }
    }

    renderLists();
    createTab();
  </script>
</body>
</html>
