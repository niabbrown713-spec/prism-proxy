    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background 0.25s, color 0.25s;
    }

    .top-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      gap: 10px;
    }
    .tabs {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      flex: 1;
    }
    .tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 12px;
      color: var(--muted);
      cursor: var(--point) 4 2, auto!important;
      max-width: 180px;
      user-select: none;
    }
    .tab.active {
      background: var(--surface-2);
      color: var(--text);
      border-color: var(--accent);
    }
    .tab span.title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tab .close-tab { opacity: 0.6; font-size: 14px; }
    .tab .close-tab:hover { opacity: 1; color: var(--accent); }

    .os-badge {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .icon-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted);
      border-radius: 7px;
      padding: 5px 8px;
      cursor: var(--point) 4 2, auto!important;
      font-size: 13px;
      transition: 0.15s;
    }
    .icon-btn:hover, .icon-btn.active {
      background: var(--surface-2);
      color: var(--accent);
      border-color: var(--border);
    }

    .nav-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .address-form {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px 12px;
    }
    .address-form:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .address-form input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 13px;
      padding: 4px 6px;
    }
    .go-btn {
      background: var(--accent);
      color: #081016;
      border: none;
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: var(--point) 4 2, auto!important;
    }

    .workspace {
      position: relative;
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    iframe#viewer {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
      display: none;
    }

    .home-screen {
      flex: 1;
      overflow-y: auto;
      padding: 36px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background:
        radial-gradient(circle at 25% 15%, var(--accent-glow), transparent 45%),
        radial-gradient(circle at 80% 85%, rgba(131, 201, 214, 0.08), transparent 45%),
        var(--bg);
    }

    .hero {
      max-width: 820px;
      width: 100%;
      text-align: center;
      margin-bottom: 24px;
    }
    .pill {
      display: inline-block;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid var(--border);
      background: var(--surface);
      padding: 5px 14px;
      border-radius: 999px;
      margin-bottom: 12px;
    }
    .hero h1 {
      font-size: 46px;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 6px;
    }
    .hero p {
      color: var(--muted);
      font-size: 15px;
      margin-bottom: 16px;
    }
    .clock-bar {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 20px;
    }
    .clock-bar strong { color: var(--text); font-variant-numeric: tabular-nums; }

    .quick-tools {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .tool-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      cursor: var(--point) 4 2, auto!important;
      transition: 0.15s;
    }
    .tool-chip:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      max-width: 840px;
      width: 100%;
      margin: 28px 0;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      text-align: left;
    }
    .card .num {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 6px;
    }
    .card h3 { font-size: 17px; margin-bottom: 6px; }
    .card p { font-size: 13px; color: var(--muted); line-height: 1.5; }

    .theme-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      max-width: 840px;
      width: 100%;
    }
    .theme-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 13px;
      border-radius: 999px;
      font-size: 12px;
      cursor: var(--point) 4 2, auto!important;
    }
    .theme-btn.active, .theme-btn:hover {
      color: var(--text);
      border-color: var(--accent);
    }

    .drawer {
      width: 300px;
      background: var(--surface);
      border-left: 1px solid var(--border);
      padding: 16px;
      display: none;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
    }
    .drawer.open { display: flex; }
    .drawer h4 {
      font-size: 13px;
      color: var(--accent);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .drawer textarea {
      height: 120px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      padding: 10px;
      font-size: 12.5px;
      resize: vertical;
      outline: none;
    }
    .history-list {
      max-height: 130px;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 12px;
    }
    .history-item {
      padding: 6px 8px;
      background: var(--bg);
      border-radius: 6px;
      cursor: var(--point) 4 2, auto!important;
      color: var(--muted);
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .history-item:hover { color: var(--accent); }

    aside.nav {
      float: right;
    }

    .nav-list li::marker {
      content: ""
    }

    a {
      text-decoration: none;
      color: white;
    }

    .games::first-letter {
      font-size: 25px;
      font-weight: bold;
    }

    .games {
      text-indent: 30px;
    }

    .one::marker {
      content: "1. ";
    }

    .two::marker {
      content: "2. ";
    }

    section {
      color: var(--text)
    }

    ::file-selector-button {
      background: var(--bg);
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 2px 8px;
      cursor: var(--point) 4 2, auto!important;
    }
  </style>
</head>
<body>
  <div class="top-strip">
    <div class="tabs" id="tabList"></div>
    <button class="icon-btn" onclick="createTab()" title="New tab">＋</button>
    <div class="os-badge">justniaaOS</div>
  </div>

  <div class="nav-bar">
    <button class="icon-btn" onclick="goHome()" title="Home">🏠</button>
    <button class="icon-btn" onclick="navBack()" title="Back">←</button>
    <button class="icon-btn" onclick="navForward()" title="Forward">→</button>
    <button class="icon-btn" onclick="navReload()" title="Refresh">↻</button>

    <form class="address-form" onsubmit="handleNavigate(event)">
      <input type="text" id="urlInput" placeholder="Search or enter a web address (e.g. wikipedia.org)" autocomplete="off" />
      <button type="button" class="icon-btn" onclick="toggleFavorite()" title="Bookmark / Favorite" id="favStar">☆</button>
      <button type="submit" class="go-btn">Go</button>
    </form>

    <button class="icon-btn" onclick="copyAddress()" title="Copy address">▣</button>
    <button class="icon-btn" onclick="toggleCodeMode()" title="Iframe Code Mode">{}</button>
    <button class="icon-btn" onclick="openDrawer('notes')" title="Notes">🗒</button>
    <button class="icon-btn" onclick="openDrawer('history')" title="History & Favorites">⌛</button>
    <button class="icon-btn" onclick="toggleFullscreen()" title="Toggle fullscreen">⛶</button>
  </div>

  <div class="workspace">
    <div id="codeEditorPane" style="display:none; width:45%; background:var(--surface); border-right:1px solid var(--border); flex-direction:column; padding:12px; gap:8px;">
      <div style="display:flex; justify-content:space-between; align-items:center; font-size:12px;">
        <strong style="color:var(--accent)">Iframe Mode — HTML Editor</strong>
        <div style="display:flex; gap:6px;">
          <button class="go-btn" onclick="runCustomHtml()">Update preview</button>
          <button class="icon-btn" onclick="toggleCodeMode()">[x]</button>
        </div>
      </div>
      <textarea id="htmlCodeInput" style="flex:1; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:10px; font-family:monospace; font-size:12px; resize:none;">&lt;body style="font-family:sans-serif;padding:24px;"&gt;&lt;h2&gt;Prism HTML Preview&lt;/h2&gt;&lt;p&gt;Write HTML, CSS, or JS and click Update preview.&lt;/p&gt;&lt;/body&gt;</textarea>
    </div>

    <iframe id="viewer" src="about:blank"></iframe>

    <div class="home-screen" id="homeScreen" style="display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%;">
      <div class="hero">
        <div class="pill">YOUR PRIVATE HTML BROWSER</div>
        <h1>Prism</h1>
        <p>A little space for everything online.</p>
        <div class="clock-bar">
          <strong id="clock">--:--</strong>
          <span>• Welcome back</span>
        </div>

        <div class="quick-tools">
          <button class="tool-chip" onclick="loadUrl('https://prism-chat-production.up.railway.app/')">💬 Prism Chat</button>
          <button class="tool-chip" onclick="loadUrl('https://web-games.io')">🕹 Games</button>
          <button class="tool-chip" onclick="toggleCodeMode()">{} Code</button>
          <button class="tool-chip" onclick="openDrawer('music')">🎵 Music</button>
          <button class="tool-chip" onclick="openDrawer('notes')">🗒 Notes</button>
        </div>

        <div style="font-size:12px; color:var(--muted); display:flex; justify-content:center; gap:16px; margin-bottom:24px;">
          <span>✦ <strong style="color:var(--text)">Your browser, your way</strong></span>
          <span>↗ <strong style="color:var(--text)">Browse, create, and save</strong></span>
        </div>
      </div>

      <div class="theme-bar" id="themeBar">
        <button class="theme-btn active" onclick="setTheme('default', this)">Default</button>
        <button class="theme-btn" onclick="setTheme('dark', this)">Dark</button>
        <button class="theme-btn" onclick="setTheme('ocean', this)">Ocean</button>
        <button class="theme-btn" onclick="setTheme('forest', this)">Forest</button>
        <button class="theme-btn" onclick="setTheme('sunset', this)">Sunset</button>
        <button class="theme-btn" onclick="setTheme('midnight', this)">Midnight</button>
      </div>
    </div>

    <aside class="drawer" id="drawer">
      <h4><span id="drawerTitle">Notes & Tools</span><span style="cursor:var(--point) 4 2, auto!important" onclick="closeDrawer()">×</span></h4>
      <textarea id="notesArea" placeholder="Jot down ideas here... saved automatically."></textarea>

      <div style="border-top:1px solid var(--border); padding-top:10px;">
        <h4 style="margin-bottom:6px;"><span>🎵 Music Player</span></h4>
        <input type="file" id="musicInput" accept="audio/*" style="font-size:11px; color:var(--muted); width:100%; margin-bottom:6px;" />
        <audio id="audioPlayer" controls style="width:100%; height:32px;"></audio>
      </div>

      <div style="border-top:1px solid var(--border); padding-top:10px;">
        <h4 style="margin-bottom:6px;"><span>★ Favorites</span></h4>
        <div class="history-list" id="favoritesList" style="max-height:90px;"></div>
      </div>

      <div style="border-top:1px solid var(--border); padding-top:10px;">
        <h4 style="margin-bottom:6px;"><span>⌛ History</span><span style="cursor:var(--point) 4 2, auto!important;font-size:11px;color:var(--muted)" onclick="clearHistory()">Clear</span></h4>
        <div class="history-list" id="historyList" style="max-height:263px;"></div>
      </div>
    </aside>
  </div>

  <script>
    let tabs = [];
    let activeTabId = null;
    let historyItems = JSON.parse(localStorage.getItem('prism_history') || '[]');
    let favoriteItems = JSON.parse(localStorage.getItem('prism_favorites') || '[]');

    const viewer = document.getElementById('viewer');
    const homeScreen = document.getElementById('homeScreen');
    const urlInput = document.getElementById('urlInput');

    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString([], {
        hour: '2-digit',
        minute: '2-digit'
      });
    }
    setInterval(updateClock, 1000);
    updateClock();

    function setTheme(theme, btn) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('prism_theme', theme);
      document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
    }

    const savedTheme = localStorage.getItem('prism_theme');
    if (savedTheme) {
      const matchBtn = Array.from(document.querySelectorAll('.theme-btn'))
        .find(b => b.textContent.toLowerCase() === savedTheme);
      setTheme(savedTheme, matchBtn);
    }

    const notesArea = document.getElementById('notesArea');
    if (notesArea) {
      notesArea.value = localStorage.getItem('prism_notes') || '';
      notesArea.addEventListener('input', () => {
        localStorage.setItem('prism_notes', notesArea.value);
      });
    }

    const musicInput = document.getElementById('musicInput');
    if (musicInput) {
      musicInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          const player = document.getElementById('audioPlayer');
          player.src = URL.createObjectURL(file);
          player.play();
        }
      });
    }

    function toggleCodeMode() {
      const pane = document.getElementById('codeEditorPane');
      const isHidden = pane.style.display === 'none' || pane.style.display === '';
      pane.style.display = isHidden ? 'flex' : 'none';
      if (isHidden) {
        homeScreen.style.display = 'none';
        viewer.style.display = 'block';
        runCustomHtml();
      }
    }

    function runCustomHtml() {
      const code = document.getElementById('htmlCodeInput').value;
      viewer.srcdoc = code || '<body style="font-family:sans-serif;padding:24px;"><h2>Prism HTML Preview</h2><p>Type HTML on the left and click Update preview.</p></body>';
    }

    function createTab(url) {
      const targetUrl = url || '';
      const id = Date.now() + Math.random();
      tabs.push({ id: id, title: targetUrl || 'Prism Home', url: targetUrl });
      switchTab(id);
    }

    function switchTab(id) {
      activeTabId = id;
      const tab = tabs.find(t => t.id === id);
      if (!tab) return;

      urlInput.value = tab.url;
      updateStarIcon();
      if (tab.url) {
        viewer.removeAttribute('srcdoc');
        homeScreen.style.display = 'none';
        viewer.style.display = 'block';

        if (tab.url.includes('prism-chat-production.up.railway.app')) {
          viewer.src = tab.url;
        } else {
          viewer.src = '/proxy?url=' + encodeURIComponent(tab.url);
        }
      } else {
        viewer.style.display = 'none';
        viewer.src = 'about:blank';
        homeScreen.style.display = 'flex';
      }
      renderTabs();
    }

    function closeTab(e, id) {
      e.stopPropagation();
      tabs = tabs.filter(t => t.id !== id);
      if (tabs.length === 0) {
        createTab();
      } else if (activeTabId === id) {
        switchTab(tabs[tabs.length - 1].id);
      } else {
        renderTabs();
      }
    }

    function renderTabs() {
      const list = document.getElementById('tabList');
      list.innerHTML = '';
      tabs.forEach(tab => {
        const el = document.createElement('div');
        el.className = 'tab' + (tab.id === activeTabId ? ' active' : '');
        el.onclick = () => switchTab(tab.id);
        el.innerHTML = '<span class="title">' + tab.title + '</span>' +
                       '<span class="close-tab" onclick="closeTab(event, ' + tab.id + ')">×</span>';
        list.appendChild(el);
      });
    }

    function handleNavigate(e) {
      e.preventDefault();
      loadUrl(urlInput.value);
    }

    function loadUrl(raw) {
      let url = raw.trim();
      if (!url) return;
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = (url.includes('.') && !url.includes(' '))
          ? 'https://' + url
          : 'https://duckduckgo.com/?q=' + encodeURIComponent(url);
      }

      const tab = tabs.find(t => t.id === activeTabId);
      if (tab) {
        tab.url = url;
        try {
          tab.title = new URL(url).hostname;
        } catch (err) {
          tab.title = url;
        }
      }

      historyItems = [url, ...historyItems.filter(item => item !== url)].slice(0, 25);
      localStorage.setItem('prism_history', JSON.stringify(historyItems));
      renderLists();
      switchTab(activeTabId);
    }

    function goHome() {
      const tab = tabs.find(t => t.id === activeTabId);
      if (tab) {
        tab.url = '';
        tab.title = 'Prism Home';
        switchTab(activeTabId);
      }
    }

    function toggleFavorite() {
      const url = urlInput.value.trim();
      if (!url) return;
      if (favoriteItems.includes(url)) {
        favoriteItems = favoriteItems.filter(u => u !== url);
      } else {
        favoriteItems.unshift(url);
      }
      localStorage.setItem('prism_favorites', JSON.stringify(favoriteItems));
      updateStarIcon();
      renderLists();
    }

    function updateStarIcon() {
      const url = urlInput.value.trim();
      document.getElementById('favStar').textContent = favoriteItems.includes(url) ? '★' : '☆';
    }

    function navBack() {
      try { viewer.contentWindow.history.back(); } catch (e) {}
    }

    function navForward() {
      try { viewer.contentWindow.history.forward(); } catch (e) {}
    }

    function navReload() {
      if (viewer.style.display === 'block') {
        viewer.src = viewer.src;
      }
    }

    function copyAddress() {
      if (urlInput.value) {
        navigator.clipboard.writeText(urlInput.value);
      }
    }

    function openDrawer() {
      document.getElementById('drawer').classList.add('open');
    }

    function closeDrawer() {
      document.getElementById('drawer').classList.remove('open');
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    function renderLists() {
      document.getElementById('historyList').innerHTML = historyItems
        .map(u => '<div class="history-item" onclick="loadUrl(\'' + u + '\')">' + u + '</div>')
        .join('');
      document.getElementById('favoritesList').innerHTML = favoriteItems
        .map(u => '<div class="history-item" onclick="loadUrl(\'' + u + '\')">★ ' + u + '</div>')
        .join('');
    }

    function clearHistory() {
      if (confirm("Are you sure you want to clear your history? This action cannot be undone.")) {
        historyItems = [];
        localStorage.removeItem('prism_history');
        renderLists();
      }
    }

    renderLists();
    createTab();
  </script>
</body>
</html>
