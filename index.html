<html lang="en"><head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <meta name="theme-color" content="#15131b">
        <meta name="description" content="justniaa’s personal Gemini-inspired AI space, with conversations and profile saved in your browser.">
        <title>justniaa’s Gemini</title>
        <style>
            :root {
                color-scheme: dark;
                --bg: #131416;
                --sidebar: #191a1c;
                --panel: #202124;
                --panel2: #292a2d;
                --surface: #242629;
                --text: #e7e8eb;
                --muted: #a4a8b0;
                --line: #373a40;
                --blue: #a8c7fa;
                --accent: #9abaff;
                --purple: #d3b5ff;
                --radius: 22px
            }

            * {
                box-sizing: border-box
            }

            html,body {
                margin: 0;
                width: 100%;
                height: 100%;
                background: var(--bg);
                color: var(--text);
                font: 14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif
            }

            body {
                overflow: hidden
            }

            button,input,textarea,select {
                font: inherit
            }

            button {
                cursor: pointer;
                color: inherit;
                border: 0
            }

            button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible {
                outline: 2px solid var(--accent);
                outline-offset: 3px
            }

            button:disabled {
                cursor: not-allowed;
                opacity: .48
            }

            ::selection {
                background: #516eaa;
                color: white
            }

            .hidden {
                display: none!important
            }

            .app {
                display: flex;
                width: 100%;
                height: 100dvh;
                background: radial-gradient(ellipse at 67% 45%,#222943 0%,#17181c 37%,#131416 72%)
            }

            .sidebar {
                width: 284px;
                min-width: 284px;
                flex-shrink: 0;
                background: rgba(26,27,29,.97);
                padding: 17px 12px 12px;
                display: flex;
                flex-direction: column;
                overflow: hidden;
                border-right: 1px solid #ffffff06;
                transition: transform .22s ease;
                z-index: 4
            }

            .brand {
                min-height: 47px;
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 0 12px 20px;
                font-size: 17px;
                font-weight: 650;
                letter-spacing: -.35px;
                white-space: nowrap
            }

            .spark {
                display: inline-block;
                font-size: 24px;
                line-height: 1;
                background: linear-gradient(135deg,#8ab4f8 5%,#c58af9 55%,#7ce8d4);
                color: transparent;
                background-clip: text;
                -webkit-background-clip: text
            }

            .iconbtn {
                background: transparent;
                border-radius: 50%;
                width: 36px;
                height: 36px;
                min-width: 36px;
                display: grid;
                place-items: center;
                color: var(--muted);
                font-size: 18px;
                transition: background .15s,color .15s
            }

            .iconbtn:hover,.smallbtn:hover {
                background: #ffffff0b;
                color: #fff
            }

            .newchat {
                display: flex;
                align-items: center;
                gap: 11px;
                background: #2b2c2f;
                border-radius: 15px;
                padding: 12px 14px;
                margin: 0 2px 14px;
                text-align: left;
                font-weight: 560;
                box-shadow: inset 0 1px #ffffff05;
                transition: background .15s,transform .15s
            }

            .newchat:hover {
                background: #34363a;
                transform: translateY(-1px)
            }

            .navbtn {
                background: transparent;
                text-align: left;
                padding: 10px 13px;
                border-radius: 12px;
                display: flex;
                gap: 12px;
                align-items: center;
                color: #c8cbd1;
                min-height: 39px;
                transition: background .15s
            }

            .navbtn span:first-child {
                width: 18px;
                text-align: center;
                color: #b6c8e9;
                font-size: 17px
            }

            .navbtn:hover,.chatitem:hover {
                background: #ffffff09
            }

            .sectionlabel {
                color: #898d96;
                padding: 23px 12px 8px;
                font-size: 11px;
                font-weight: 650;
                letter-spacing: .09em;
                text-transform: uppercase
            }

            .chatlist {
                overflow: auto;
                flex: 1;
                min-height: 80px;
                scrollbar-width: thin;
                scrollbar-color: #42444a transparent;
                padding: 0 1px
            }

            .chatitem {
                display: flex;
                gap: 7px;
                align-items: center;
                width: 100%;
                padding: 9px 11px;
                border-radius: 11px;
                background: transparent;
                text-align: left;
                white-space: nowrap;
                overflow: hidden;
                color: #c4c7ce;
                min-height: 38px;
                transition: background .15s
            }

            .chatitem.active {
                background: #34363a;
                color: #f1f2f4
            }

            .chatname {
                overflow: hidden;
                text-overflow: ellipsis;
                flex: 1
            }

            .deletechat {
                opacity: 0;
                color: #a8abb1;
                background: transparent;
                padding: 2px 5px;
                font-size: 18px;
                line-height: 1;
                border-radius: 5px
            }

            .chatitem:hover .deletechat,.chatitem:focus-within .deletechat {
                opacity: 1
            }

            .deletechat:hover {
                background: #4a3033;
                color: #ffb4ab
            }

            .profile {
                border-top: 1px solid #ffffff0d;
                margin-top: 10px;
                padding: 13px 5px 3px;
                display: flex;
                align-items: center;
                gap: 10px;
                min-width: 0
            }

            .avatar {
                width: 36px;
                height: 36px;
                border-radius: 50%;
                background: linear-gradient(135deg,#7e8fbc,#4d526b);
                object-fit: cover;
                display: grid;
                place-items: center;
                font-weight: 700;
                color: #fff;
                overflow: hidden;
                flex-shrink: 0;
                box-shadow: 0 0 0 2px #ffffff12
            }

            .profile-name {
                flex: 1;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                font-weight: 550;
                font-size: 13px
            }

            .profile .iconbtn {
                width: 32px;
                min-width: 32px
            }

            .main {
                flex: 1;
                min-width: 0;
                display: flex;
                flex-direction: column;
                position: relative
            }

            .topbar {
                height: 62px;
                min-height: 62px;
                display: flex;
                align-items: center;
                padding: 0 26px;
                gap: 10px;
                border-bottom: 1px solid #ffffff05
            }

            .topbar-context {
                display: flex;
                align-items: center;
                gap: 12px;
                margin-right: auto;
                color: #c5c8cf;
                font-size: 13px
            }

            .topbar-context strong {
                font-weight: 600;
                color: #e4e6ea
            }

            .status {
                display: flex;
                align-items: center;
                gap: 7px;
                color: #9096a2;
                font-size: 11px
            }

            .status-dot {
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: #797e87
            }

            .status-dot.ready {
                background: #8cceaa;
                box-shadow: 0 0 10px #8cceaa35
            }

            .pill {
                background: #292b2e;
                border: 1px solid #ffffff08;
                border-radius: 22px;
                padding: 8px 13px;
                color: #d7d9df;
                font-size: 12px;
                font-weight: 560;
                transition: background .15s,transform .15s
            }

            .pill:hover {
                background: #37393d;
                transform: translateY(-1px)
            }

            .pill.primary {
                background: #a8c7fa;
                color: #15223a;
                border-color: transparent
            }

            .pill.primary:hover {
                background: #bed4fc
            }

            .settings-trigger {
                font-size: 22px
            }

            .workspace {
                flex: 1;
                min-height: 0;
                overflow: auto;
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 25px 28px 14px;
                scrollbar-width: thin;
                scrollbar-color: #44464c transparent
            }

            .welcome {
                margin: auto 0;
                max-width: 850px;
                width: 100%;
                padding: 0 0 22px
            }

            .welcome-eyebrow {
                display: flex;
                align-items: center;
                gap: 9px;
                color: #b3c7eb;
                font-size: 12px;
                font-weight: 650;
                letter-spacing: .13em;
                text-transform: uppercase;
                margin-bottom: 18px
            }

            .welcome h1 {
                font-size: clamp(34px,4.1vw,51px);
                line-height: 1.1;
                letter-spacing: -1.8px;
                font-weight: 550;
                margin: 0 0 13px;
                background: linear-gradient(100deg,#a8c7fa 0%,#d7c1fb 44%,#f0f0f2 82%);
                color: transparent;
                background-clip: text;
                -webkit-background-clip: text
            }

            .welcome-subtitle {
                margin: 0 0 30px;
                color: #a4a8b0;
                font-size: 15px;
                letter-spacing: .01em
            }

            .suggestions {
                display: grid;
                grid-template-columns: repeat(4,minmax(0,1fr));
                gap: 12px;
                margin-top: 26px
            }

            .suggestion {
                min-height: 128px;
                text-align: left;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                gap: 22px;
                padding: 16px;
                border-radius: 18px;
                border: 1px solid #ffffff0c;
                background: linear-gradient(145deg,#24262b,#1c1e22);
                color: #d7d9df;
                transition: transform .17s,border-color .17s,background .17s;
                box-shadow: 0 8px 24px #0000000a
            }

            .suggestion:hover {
                transform: translateY(-3px);
                border-color: #8ab4f844;
                background: linear-gradient(145deg,#2b2e
